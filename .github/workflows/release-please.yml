# Automates the version bump / CHANGELOG / tag / draft release.
#
# release-please-config.json sets `skip-github-release: false` and `draft: true`:
# release-please tags the version and opens the draft GitHub Release with the
# generated changelog notes. release.yml (tag push trigger) then only attaches
# build artifacts, an SBOM, and provenance attestations to that same release —
# it does not create its own, which is what used to race `gh release create`
# against a release-please release for the same tag.
#
# `skip-github-release: true` looks like the right knob for "let release.yml own
# the release" but isn't: release-please's `buildRelease()` skips creating the tag
# itself when that flag is set, not just the release notes, so nothing would ever
# tag main and release.yml's tag-push trigger would never fire.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
