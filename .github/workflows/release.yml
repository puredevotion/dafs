# Release pipeline: runs only on version tags.
#
# Routine CI lives in two places that run the same checks — ci.yml here, and the
# Dagger module in ci/ which runs anywhere. This workflow is the one thing that
# is genuinely GitHub-specific: cutting a release, attaching artifacts, and
# publishing provenance.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a manual re-run)"
        required: true

permissions:
  contents: write # creating the release and uploading assets
  id-token: write # provenance attestation
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Never publish a release that has not passed the full gate. This duplicates
  # ci.yml deliberately: a tag can be pushed without the tagged commit ever
  # having been through a pull request.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
        env:
          RUSTFLAGS: "-D warnings"
      - run: cargo test --all-features
      - run: cargo build --release -p dafs-daemon
      - run: cargo test --release -p dafs-memtest -- --nocapture

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: dafs-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            name: dafs-aarch64-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # jemalloc and bundled SQLite are C, so cross-compiling needs a cross
      # linker and compiler — not just a Rust target.
      - name: Install cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p dafs-daemon --target ${{ matrix.target }}

      # Stripped here rather than in the release profile: cargo would apply a
      # profile-level `strip` to build scripts and proc-macros too, and stripping
      # those is a route to obscure build failures. Doing it in packaging affects
      # only the artifact actually shipped.
      - name: Strip and package
        run: |
          BIN=target/${{ matrix.target }}/release/dafs
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip "$BIN"
          else
            strip "$BIN"
          fi
          tar -czf ${{ matrix.name }}.tar.gz -C "$(dirname "$BIN")" dafs
          sha256sum ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.name }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256

  sbom:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
          find . -name '*.cdx.json' -not -path './target/*' -print
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"

  publish:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # release-please (release-please.yml) creates the tag and the draft
          # release with the generated changelog notes; this step only uploads
          # build artifacts to it. `--clobber` makes a re-run idempotent.
          #
          # Fall back to creating the release here if one doesn't already exist —
          # a workflow_dispatch re-run can target a tag release-please never saw.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber $(find artifacts -type f | tr '\n' ' ')
          else
            gh release create "$TAG" \
              --draft \
              --generate-notes \
              --title "$TAG" \
              $(find artifacts -type f | tr '\n' ' ')
          fi
