# Release pipeline: runs only on version tags.
#
# Routine CI lives in two places that run the same checks — ci.yml here, and the
# Dagger module in ci/ which runs anywhere. This workflow is the one thing that
# is genuinely GitHub-specific: cutting a release, attaching artifacts, and
# publishing provenance.
#
# # Supply-chain posture (SLSA)
#
# `actions/attest-build-provenance` is kept rather than switching to
# slsa-framework/slsa-github-generator's reusable workflow — that generator is
# what actually earns a certified SLSA Build L3 (an isolated, non-forkable
# trusted builder that the calling workflow cannot influence after the fact);
# a normal job in this workflow is not that, no matter how it's hardened, since
# arbitrary steps here still run with the same token that signs the
# attestation. What follows is "as good as that gets without adopting a
# different builder", not a claim of certified L3:
#
#   - Every third-party action below is pinned to a commit SHA, not a
#     floating tag, with the tag kept only as a trailing comment. A compromised
#     or re-tagged action version cannot inject anything into a build whose
#     provenance is then attested as trustworthy — this is the actual
#     falsifiability gap between "provenance exists" and "provenance means
#     something", and it's the one thing here fully in this repo's control.
#   - Permissions are scoped per job, not just at the workflow level: only
#     `build` and `sbom` carry `id-token`/`attestations` write, `verify` is
#     read-only, and `publish` (which never builds anything) carries neither.
#     A step compromised in one job cannot mint an attestation for another.
#   - The build has no secrets and no network beyond crates.io/npm during
#     dependency fetch (see `hermetic` in ci.yml) — there is nothing an
#     attacker-controlled build step could exfiltrate that this token doesn't
#     already make irrelevant, and nothing it could reach that isn't already
#     public.
#   - Every attestable output is attested, not just the primary binary: the
#     tarball, its detached checksum, and the CycloneDX SBOM all get subjects
#     ("max provenance" in the sense of maximal coverage of what ships).
#
# The Dagger module (`ci/`) mirrors `build` and `sbom` byte-for-byte so a
# release is reproducible outside GitHub too, but it cannot mint this
# attestation itself: Sigstore-backed signing needs the ambient OIDC identity
# only GitHub Actions' `id-token: write` provides, and Dagger has no
# equivalent when run standalone. That split is deliberate, not a gap — same
# division `ci/main.go`'s own docs already draw for `publish`: Dagger produces
# the artifact, the GitHub workflow that has the OIDC identity is what attests
# and ships it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a manual re-run)"
        required: true

# No default write access. Every job below states exactly what it needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Never publish a release that has not passed the full gate. This duplicates
  # ci.yml deliberately: a tag can be pushed without the tagged commit ever
  # having been through a pull request.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
        env:
          RUSTFLAGS: "-D warnings"
      - run: cargo test --all-features
      - run: cargo build --release -p dafs-daemon
      - run: cargo test --release -p dafs-memtest -- --nocapture

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation
      attestations: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: dafs-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            name: dafs-aarch64-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # jemalloc and bundled SQLite are C, so cross-compiling needs a cross
      # linker and compiler — not just a Rust target.
      - name: Install cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p dafs-daemon --target ${{ matrix.target }}

      # Stripped here rather than in the release profile: cargo would apply a
      # profile-level `strip` to build scripts and proc-macros too, and stripping
      # those is a route to obscure build failures. Doing it in packaging affects
      # only the artifact actually shipped.
      - name: Strip and package
        run: |
          BIN=target/${{ matrix.target }}/release/dafs
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip "$BIN"
          else
            strip "$BIN"
          fi
          tar -czf ${{ matrix.name }}.tar.gz -C "$(dirname "$BIN")" dafs
          sha256sum ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      # One call, two subjects: the tarball and its detached checksum both get
      # covered by the same provenance statement, rather than attesting only
      # the binary and leaving the checksum file unattested alongside it.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256

  sbom:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
          find . -name '*.cdx.json' -not -path './target/*' -print

      # cargo-audit/cargo-deny (ci.yml's `audit` job) check the dependency
      # graph cargo itself sees. This checks the SBOM that actually ships
      # with the release instead — a real, if narrow, gap between the two:
      # a mismatch here would mean the SBOM doesn't describe what cargo-audit
      # already cleared, which is its own bug worth catching.
      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin v0.116.0
          grype version

      - name: Scan the generated SBOM for known vulnerabilities
        run: |
          status=0
          while IFS= read -r sbom; do
            echo "::group::grype $sbom"
            grype "sbom:$sbom" --fail-on high || status=1
            echo "::endgroup::"
          done < <(find . -name '*.cdx.json' -not -path './target/*')
          exit "$status"

      # The SBOM is a shipped release artifact like the tarballs are — attest
      # it too, so "max provenance" covers what describes the release, not
      # only the binary itself.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "**/*.cdx.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: "**/*.cdx.json"

  publish:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the release and uploading assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # release-please (release-please.yml) creates the tag and the draft
          # release with the generated changelog notes; this step only uploads
          # build artifacts to it. `--clobber` makes a re-run idempotent.
          #
          # Fall back to creating the release here if one doesn't already exist —
          # a workflow_dispatch re-run can target a tag release-please never saw.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber $(find artifacts -type f | tr '\n' ' ')
          else
            gh release create "$TAG" \
              --draft \
              --generate-notes \
              --title "$TAG" \
              $(find artifacts -type f | tr '\n' ' ')
          fi
