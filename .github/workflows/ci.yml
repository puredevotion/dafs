# The CI gate. Every check here is a merge requirement.
#
# The load-bearing property is that all of this runs with no secrets, no private
# DNS, and no access to any deployment environment. A tree that cannot pass here
# cannot be built by anyone but its author, which would defeat the point of the
# repository being public.
#
# These checks are mirrored by the Dagger module in ci/, which runs the same
# suite on any machine with Dagger installed. That redundancy is deliberate: it
# means the project does not depend on a single forge staying free or available,
# and a disagreement between the two is a real environment-dependency bug worth
# knowing about. Keep the two in step — a check added here belongs in ci/main.go
# too, and vice versa.
#
# Release builds and artifacts live in release.yml, on version tags only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so advisories surface without waiting for a commit.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI without putting a blanket deny in the source, which
  # would make local iteration painful.
  RUSTFLAGS: "-D warnings"

jobs:
  commit-lint:
    # release-please (release-please.yml) derives the version bump and
    # CHANGELOG.md entry from each commit subject on main. A non-conforming
    # commit isn't an error there — it's silently excluded from that decision,
    # which is how v0.0.1 shipped with an empty changelog. This job is the
    # backstop for the local commit-msg hook (scripts/install-hooks.sh),
    # since --no-verify bypasses that one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit subjects are Conventional Commits
        run: |
          set -uo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          while read -r sha subject; do
            case "$subject" in
              "Merge "*|"fixup! "*|"squash! "*) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::$sha does not follow Conventional Commits: \"$subject\""
              bad=1
            fi
          done < <(git log --format='%H %s' "$base..$head")
          [ "$bad" -eq 0 ] || exit 1
          echo "all commit subjects are Conventional Commits"

  cargo-versions:
    # release-please's cargo-workspace plugin needs a literal semver in every
    # member's [package.version] — see scripts/check-crate-versions.sh for the
    # incident this guards against.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check crate manifest versions
        run: ./scripts/check-crate-versions.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      # Verify the fuzz target still compiles. It lives outside the workspace
      # (cargo-fuzz needs its own profile), so `cargo test` does not cover it and
      # it would rot silently.
      - name: Check fuzz targets compile
        working-directory: fuzz
        run: cargo check

  ui-bundle:
    # `ui/dist/index.html` is committed and embedded into the daemon with
    # include_str!, because the Rust build has to work with no network and an
    # `npm ci` in front of `cargo build` would break that (see the `hermetic`
    # job below).
    #
    # The risk that buys is a committed artifact drifting from its source. This
    # job removes it: rebuild from ui/src and fail if the result differs from
    # what is in the tree. So the bundle is reproducible, and a PR that edits
    # the frontend without rebuilding cannot merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock disagree, which is what makes the
      # rebuild below reproducible rather than merely likely.
      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Rebuild the bundle
        working-directory: ui
        run: npm run build

      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- ui/dist; then
            echo "::error::ui/dist is out of date — run 'npm run build' in ui/ and commit the result"
            git diff --stat -- ui/dist
            exit 1
          fi
          echo "committed bundle matches a fresh build"

      # The daemon serves exactly one file and has no route for sibling assets,
      # so a build that emitted a separate .js or .css would render a blank page
      # in production while every Rust test still passed.
      - name: Assert the bundle is a single self-contained file
        run: |
          count=$(find ui/dist -type f | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::ui/dist must contain exactly one file, found $count"
            find ui/dist -type f
            exit 1
          fi
          echo "bundle is a single file"

  memory-budget:
    # The RSS ceiling from docs/memory-budget.md, asserted against the release
    # binary. Separate job because it needs a release build, which is slow and
    # would hold up the fast feedback from `test`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release daemon
        run: cargo build --release -p dafs-daemon

      - name: Assert RSS ceilings
        run: cargo test --release -p dafs-memtest -- --nocapture

  hermetic:
    # Proves the build needs no network. Dependencies are vendored first (which
    # does use the network), then the build runs with --offline; anything still
    # reaching out fails loudly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Vendor dependencies and point cargo at them
        run: |
          mkdir -p .cargo
          cargo vendor --versioned-dirs vendor > .cargo/config.toml

      - name: Build offline
        run: cargo build --offline --all-targets

      - name: Test offline
        run: cargo test --offline

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check

  gitleaks:
    # Backstop for .githooks/pre-push (scripts/install-hooks.sh), the same
    # pairing commit-lint is to the commit-msg hook: a clone without hooks
    # installed, or a `--no-verify`/`--no-verify`-equivalent push, still hits
    # this. `fetch-depth: 0` because a PR's `--log-opts` range and a full
    # history scan both need real history, not the default shallow clone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="--all"
          fi
          gitleaks git --log-opts="$range" --redact --no-banner .

  fuzz-smoke:
    # A short run per push. Not a campaign — it catches a target that has stopped
    # working, and the occasional shallow crash. Long campaigns are a separate,
    # scheduled concern once there is more surface to fuzz.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz the metadata store (60s)
        run: cargo fuzz run migrations -- -max_total_time=60

      # Filenames are bytes the user did not type: on Unix anything but NUL and
      # `/` is a legal component, so invalid UTF-8 and traversal-shaped names
      # arrive from nothing more exotic than scanning a directory.
      - name: Fuzz path interning (60s)
        run: cargo fuzz run paths -- -max_total_time=60

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  dast:
    # Dynamic scanning against a running daemon.
    #
    # The testing bar scopes DAST to milestones that actually have an HTTP
    # surface — three in the whole roadmap — and M01's timeline API is the
    # first. Listing it against a milestone with no server produces a checkbox
    # nobody can honestly tick, so this job exists from here and not before.
    #
    # The daemon binds loopback and is unauthenticated by design, so the finding
    # this is looking for is not "no auth" — that is a known, documented
    # pairing. It is the accidental kind: a reflected value, a header that
    # leaks a path, a crash on a malformed query.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the daemon
        run: cargo build --release -p dafs-daemon

      - name: Start it against a small corpus
        run: |
          mkdir -p /tmp/dast-corpus/docs /tmp/dast-data
          echo "hello" > /tmp/dast-corpus/docs/note.md
          echo "world" > /tmp/dast-corpus/readme.txt
          # 0.0.0.0 so the scanner containers can reach it. Acceptable only
          # because this is an ephemeral CI runner; the daemon's own default
          # stays loopback.
          ./target/release/dafs \
            --listen 0.0.0.0:7878 \
            --data-dir /tmp/dast-data \
            --watch /tmp/dast-corpus \
            --log info &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:7878/readyz > /dev/null; then
              echo "daemon ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::daemon did not become ready"; exit 1

      - name: Confirm there is something to scan
        # A scanner pointed at an empty timeline passes trivially. Fail loudly
        # rather than report a clean run against no data.
        run: |
          events=$(curl -sf http://127.0.0.1:7878/events | grep -o '"id"' | wc -l)
          echo "timeline has $events events"
          [ "$events" -gt 0 ] || { echo "::error::no events to scan against"; exit 1; }

      # ghcr.io/zaproxy/zaproxy is a large multi-hundred-MB image and a fresh
      # GitHub-hosted runner has no Docker layer cache, so the action's own
      # `docker pull` re-fetches it in full on every run. Pinned to a real
      # release (not the floating `stable` tag) specifically so this cache
      # key stays valid run to run — bump the tag and this key together.
      - name: Cache ZAP image
        id: zap-image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/zap-image.tar
          key: zap-image-ghcr.io-zaproxy-zaproxy-2.16.1

      - name: Load or pull ZAP image
        run: |
          if [ -f /tmp/zap-image.tar ]; then
            docker load -i /tmp/zap-image.tar
          else
            docker pull ghcr.io/zaproxy/zaproxy:2.16.1
            docker save ghcr.io/zaproxy/zaproxy:2.16.1 -o /tmp/zap-image.tar
          fi

      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:7878
          docker_name: ghcr.io/zaproxy/zaproxy:2.16.1
          rules_file_name: .zap/rules.tsv
          # Report, do not fail the build on warnings. ZAP's baseline flags
          # missing security headers on every unauthenticated local API, and a
          # gate that always fails is a gate everyone learns to ignore. Errors
          # (an actual vulnerability rule) still fail.
          cmd_options: "-a"
          allow_issue_writing: false

      - name: nuclei
        # v3 is CLI-first (no more target/flags inputs — see the project's
        # MIGRATION.md) and runs as a node24 action. `cache: true` (the
        # default) has it restore/save the nuclei binary, templates, and
        # config across runs instead of re-fetching every time — this is
        # what "pre-installed" means for a hosted action: the binary itself
        # is vendored by GitHub's own action, the templates are cached, and
        # only a genuinely new template release ever re-downloads.
        uses: projectdiscovery/nuclei-action@v3
        with:
          args: -u http://127.0.0.1:7878 -severity critical,high,medium

  no-private-references:
    # Structural counterpart to the hermetic build: catch internal hostnames and
    # private address ranges before they are published. A denylist alone fails
    # open, which is why the offline build is the real gate — this is the cheap
    # fast check that catches the obvious cases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for private references
        run: |
          set -uo pipefail
          patterns='\.home\.arpa|\.internal\.arpa|192\.168\.|10\.(4[0-9]|[0-9])\.|172\.(1[6-9]|2[0-9]|3[01])\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.'
          if grep -rInE "$patterns" \
               --include='*.rs' --include='*.toml' --include='*.md' \
               --include='*.yml' --include='*.nix' --include='*.html' \
               . ; then
            echo "::error::private reference found — see matches above"
            exit 1
          fi
          echo "no private references found"

  nix:
    # The package the homelab (and any other Nix deployer) consumes as a flake
    # input. Building it here means a broken flake fails on the PR that broke it,
    # not on whoever next tries to deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build the flake package
        run: nix build .#dafs --print-build-logs
      - name: Check the flake
        run: nix flake check --print-build-logs
