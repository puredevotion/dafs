[package]
name = "dafs-scan"
description = "DAFS filesystem observer: initial scan and live watch"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published to crates.io: the deliverable is the daemon binary, not a set of
# library crates. This also lets cargo-deny's allow-wildcard-paths exempt the
# versionless intra-workspace path dependencies, which it only does for
# unpublished crates (crates.io forbids path deps, so a published crate with one
# is genuinely broken).
publish = false

[dependencies]
dafs-store = { path = "../dafs-store" }
rusqlite.workspace = true
thiserror.workspace = true
tracing.workspace = true
walkdir = "2"

# Filesystem notifications. Pinned to the 8.x stable line rather than the 9.0
# release candidate: this is the component that decides whether a user's change
# is noticed at all, and an RC is not the place to find out it regressed.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

dafs-alloc = { path = "../dafs-alloc" }

[dev-dependencies]
tempfile = "3"
