[package]
name = "dafs-api"
description = "DAFS HTTP API surface"
version = "0.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published to crates.io: the deliverable is the daemon binary, not a set of
# library crates. This also lets cargo-deny's allow-wildcard-paths exempt the
# versionless intra-workspace path dependencies, which it only does for
# unpublished crates (crates.io forbids path deps, so a published crate with one
# is genuinely broken).
publish = false

[dependencies]
dafs-alloc = { path = "../dafs-alloc" }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
