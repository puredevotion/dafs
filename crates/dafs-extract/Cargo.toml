[package]
name = "dafs-extract"
description = "DAFS deterministic metadata extraction: PDF, Office, EXIF, git, no LLM"
version = "0.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
gix = "0.86.0"
# default-features off: "cfb" (legacy MS Compound File detection, for old
# .doc/.xls) and its wasm-bindgen pull-in are not needed — this crate only
# ever runs natively and only sniffs formats it has an extractor for.
infer = { version = "0.22.0", default-features = false, features = ["std"] }
kamadak-exif = "0.6.1"
quick-xml = "0.41.0"
thiserror.workspace = true
tracing.workspace = true
whatlang = "0.18.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
