[package]
name = "dafs-daemon"
description = "DAFS daemon"
version = "0.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published to crates.io: the deliverable is the daemon binary, not a set of
# library crates. This also lets cargo-deny's allow-wildcard-paths exempt the
# versionless intra-workspace path dependencies, which it only does for
# unpublished crates (crates.io forbids path deps, so a published crate with one
# is genuinely broken).
publish = false

[[bin]]
name = "dafs"
path = "src/main.rs"

[dependencies]
dafs-alloc = { path = "../dafs-alloc" }
dafs-api = { path = "../dafs-api" }
dafs-detach = { path = "../dafs-detach" }
dafs-enrich = { path = "../dafs-enrich" }
dafs-extract = { path = "../dafs-extract" }
dafs-scan = { path = "../dafs-scan" }
dafs-store = { path = "../dafs-store" }
rusqlite.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
