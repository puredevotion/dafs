[package]
name = "dafs-vecstore"
description = "DAFS vector search: registers the sqlite-vec extension for dafs-store"
version = "0.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published to crates.io: the deliverable is the daemon binary, not a set of
# library crates. This also lets cargo-deny's allow-wildcard-paths exempt the
# versionless intra-workspace path dependencies, which it only does for
# unpublished crates (crates.io forbids path deps, so a published crate with one
# is genuinely broken).
publish = false

[dependencies]
rusqlite.workspace = true
sqlite-vec = "0.1"

[dev-dependencies]
tempfile = "3"
