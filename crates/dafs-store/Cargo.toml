[package]
name = "dafs-store"
description = "DAFS metadata store: SQLite schema, migrations, and connection tuning"
version = "0.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published to crates.io: the deliverable is the daemon binary, not a set of
# library crates. This also lets cargo-deny's allow-wildcard-paths exempt the
# versionless intra-workspace path dependencies, which it only does for
# unpublished crates (crates.io forbids path deps, so a published crate with one
# is genuinely broken).
publish = false

[dependencies]
rusqlite.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
