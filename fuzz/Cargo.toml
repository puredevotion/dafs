[package]
name = "dafs-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dafs-store = { path = "../crates/dafs-store" }
dafs-extract = { path = "../crates/dafs-extract" }
dafs-enrich = { path = "../crates/dafs-enrich" }
tempfile = "3"

# The fuzz crate is intentionally OUTSIDE the workspace: cargo-fuzz builds it
# with its own sanitizer flags, and inheriting the workspace's release profile
# (panic = "abort") breaks libfuzzer's crash reporting.
[workspace]

[[bin]]
name = "migrations"
path = "fuzz_targets/migrations.rs"
test = false
doc = false
bench = false

# Filenames are bytes the user did not type: on Unix any sequence except NUL and
# `/` is a legal name, so invalid UTF-8 and traversal-shaped components arrive
# from nothing more exotic than scanning a directory.
[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false

# M02's document extractors, per the testing bar
# (docs/roadmap-and-design-review.md §5.2 item 3): every parser touching bytes
# the user did not type gets a fuzz target. PDF is excluded — it goes through
# a separate native pdfium worker, out of scope for this crate.
[[bin]]
name = "docx_extract"
path = "fuzz_targets/docx_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx_extract"
path = "fuzz_targets/xlsx_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pptx_extract"
path = "fuzz_targets/pptx_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exif_extract"
path = "fuzz_targets/exif_extract.rs"
test = false
doc = false
bench = false

# `dafs-enrich`'s two response parsers — network-supplied JSON, the same
# untrusted-input class every extractor target above already covers, per
# `docs/m03-semantic-search.md`'s "Deliberately not done" note that this was
# an existing M02b gap ("this now applies to a second parser").
[[bin]]
name = "enrich_response"
path = "fuzz_targets/enrich_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "embed_response"
path = "fuzz_targets/embed_response.rs"
test = false
doc = false
bench = false
