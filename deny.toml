# cargo-deny configuration. Checked in CI (see .github/workflows/ci.yml).

[advisories]
version = 2
# Unmaintained crates are a warning rather than a failure: the useful signal is
# "this needs replacing eventually", not "the build stops today". Actual
# vulnerabilities are errors by default and stay that way.
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
# Permissive licences only. This is an MIT project; a copyleft dependency would
# change the terms under which it can be used, which is a decision to make
# deliberately rather than discover.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  # A public-domain dedication rather than a licence, and more permissive than
  # everything above it — it imposes no attribution or notice requirement at
  # all. Added deliberately for `notify`, the filesystem watcher M01 depends on.
  # Note that CC0 does not grant patent rights, which several of the entries
  # above do; that matters for a patent-heavy dependency and does not for a
  # filesystem event wrapper.
  "CC0-1.0",
  "Unicode-3.0",
  "Zlib",
  # Weak, file-level copyleft rather than GPL-style: it only obliges sharing
  # modifications to files actually licensed under it, and this project never
  # modifies or vendors uluru's source, only links against it unmodified.
  # Added deliberately for `uluru`, pulled in unconditionally by gix-pack
  # (M02a's git metadata extractor, crates/dafs-extract) for its packfile
  # object cache — there is no gix feature flag that avoids gix-pack, since
  # reading packed objects is not optional for a real repository.
  "MPL-2.0",
]
confidence-threshold = 0.9
# `license-not-encountered` warnings for entries in this list are expected and
# harmless: the list is what we are willing to accept, not what the current
# dependency graph happens to use. Removing an entry the moment nothing uses it
# just means adding it back the next time a transitive dependency shifts.

[bans]
# Duplicate versions are a warning, not an error: they are usually forced by a
# transitive dependency we do not control (currently `syn`, pulled at two
# versions by different proc-macro crates). Worth seeing, not worth blocking on.
multiple-versions = "warn"

# Wildcard requirements on registry crates are a real hazard — they let a
# breaking release in silently. But intra-workspace `path` dependencies carry no
# version by design and cargo-deny counts those as wildcards too, so exempt
# exactly those while keeping the check on for anything from a registry.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
