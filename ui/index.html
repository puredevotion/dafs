<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAFS</title>
<!--
  M00 UI shell. Deliberately a single static file with no build step, no
  framework, and no dependencies: there is nothing to render yet, and a
  toolchain added now would be a toolchain to maintain through five milestones
  before it earns anything. M01 adds the timeline; that is when a real
  frontend build (if any) gets chosen, against actual requirements.

  It does one useful thing: shows whether the daemon is up and what schema
  version it has, so the walking skeleton is verifiable by eye.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.5 system-ui, sans-serif;
    max-width: 40rem; margin: 4rem auto; padding: 0 1rem;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .sub { opacity: 0.6; margin-top: 0; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.4rem 1rem; }
  dt { opacity: 0.6; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .bad { color: #c00; }
  @media (prefers-color-scheme: dark) { .bad { color: #f66; } }
</style>

<h1>DAFS</h1>
<p class="sub">Distributed AI-native filesystem — M00 walking skeleton</p>

<dl>
  <dt>Daemon</dt><dd id="status">checking…</dd>
  <dt>Version</dt><dd id="version">—</dd>
  <dt>Schema</dt><dd id="schema">—</dd>
  <dt>Resident</dt><dd id="rss">—</dd>
</dl>

<script type="module">
const set = (id, text, bad = false) => {
  const el = document.getElementById(id);
  el.textContent = text;
  el.classList.toggle("bad", bad);
};

async function refresh() {
  try {
    const r = await fetch("/version");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const v = await r.json();
    set("status", "up");
    set("version", v.version);
    set("schema", `v${v.schema_version}`);
  } catch (e) {
    set("status", `unreachable (${e.message})`, true);
    return;
  }

  // RSS comes from the Prometheus endpoint rather than a JSON one: it exists
  // for scrapers first, and duplicating it into a second format would mean two
  // places to keep correct.
  try {
    const text = await (await fetch("/metrics")).text();
    const line = text.split("\n").find(l => l.startsWith("dafs_resident_bytes "));
    if (line) {
      const bytes = Number(line.split(" ")[1]);
      set("rss", `${(bytes / 1048576).toFixed(1)} MiB`);
    }
  } catch { /* metrics are optional for the shell to be useful */ }
}

refresh();
setInterval(refresh, 5000);
</script>
