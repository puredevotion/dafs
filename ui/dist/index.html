  <body>
    <header>
      <h1>DAFS</h1>
      <p class="sub">What changed, most recent first</p>
    </header>

    <section class="status">
      <dl>
        <dt>Daemon</dt>
        <dd id="status">checking…</dd>
        <dt>Files</dt>
        <dd id="files">—</dd>
        <dt>Events</dt>
        <dd id="event-count">—</dd>
        <dt>Resident</dt>
        <dd id="rss">—</dd>
      </dl>
    </section>

    <nav class="filters" aria-label="Filter by event kind">
      <button type="button" data-kind="" class="active" aria-pressed="true">All</button>
      <button type="button" data-kind="created" aria-pressed="false">Created</button>
      <button type="button" data-kind="modified" aria-pressed="false">Modified</button>
      <button type="button" data-kind="deleted" aria-pressed="false">Deleted</button>
      <button type="button" data-kind="renamed" aria-pressed="false">Renamed</button>
    </nav>

    <main>
      <ol id="timeline" class="timeline" aria-live="polite"></ol>
      <p id="message" class="message" hidden></p>
      <button type="button" id="more" class="more" hidden>Load more</button>
    </main>

  </body>
</html>
