    <style rel="stylesheet" crossorigin>:root{color-scheme:light dark;--bg: #ffffff;--fg: #1a1a1a;--muted: #6b6b6b;--line: #e4e4e4;--accent: #2563eb;--bad: #c00000;--created: #15803d;--modified: #b45309;--deleted: #b91c1c;--renamed: #6d28d9;--created-bg: #dcfce7;--modified-bg: #fef3c7;--deleted-bg: #fee2e2;--renamed-bg: #ede9fe}@media(prefers-color-scheme:dark){:root{--bg: #16181d;--fg: #e8e8e8;--muted: #9a9a9a;--line: #2c2f36;--accent: #60a5fa;--bad: #f87171;--created: #4ade80;--modified: #fbbf24;--deleted: #f87171;--renamed: #c4b5fd;--created-bg: #14351f;--modified-bg: #3a2c0c;--deleted-bg: #3d1717;--renamed-bg: #2a1f47}}*{box-sizing:border-box}body{margin:0 auto;padding:2rem 1rem 4rem;max-width:62rem;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}h1{font-size:1.4rem;margin:0}.sub{margin:.15rem 0 1.5rem;color:var(--muted)}.status{border:1px solid var(--line);border-radius:8px;padding:.75rem 1rem;margin-bottom:1.25rem}.status dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.5rem 1.5rem;margin:0}.status dt{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}.status dd{margin:0;font-variant-numeric:tabular-nums}.bad{color:var(--bad)}.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}.filters button{font:inherit;font-size:.85rem;padding:.3rem .75rem;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}.filters button:hover{border-color:var(--accent);color:var(--fg)}.filters button.active{background:var(--accent);border-color:var(--accent);color:#fff}.filters button:focus-visible,.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.facets{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.25rem;margin-bottom:1rem;font-size:.85rem;color:var(--muted)}.facets select{font:inherit;font-size:.85rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6   <body>
    <header>
      <h1>DAFS</h1>
      <p class="sub">What changed, most recent first</p>
    </header>

    <section class="status">
      <dl>
        <dt>Daemon</dt>
        <dd id="status">checking…</dd>
        <dt>Files</dt>
        <dd id="files">—</dd>
        <dt>Events</dt>
        <dd id="event-count">—</dd>
        <dt>Resident</dt>
        <dd id="rss">—</dd>
      </dl>
    </section>

    <nav class="filters" aria-label="Filter by event kind">
      <button type="button" data-kind="" class="active" aria-pressed="true">All</button>
      <button type="button" data-kind="created" aria-pressed="false">Created</button>
      <button type="button" data-kind="modified" aria-pressed="false">Modified</button>
      <button type="button" data-kind="deleted" aria-pressed="false">Deleted</button>
      <button type="button" data-kind="renamed" aria-pressed="false">Renamed</button>
    </nav>

    <main>
      <ol id="timeline" class="timeline" aria-live="polite"></ol>
      <p id="message" class="message" hidden></p>
      <button type="button" id="more" class="more" hidden>Load more</button>
    </main>

  </body>
</html>
